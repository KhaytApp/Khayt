# The desktop and the phone are one contract split across two languages, and
# nothing else in CI ever compares them: the Ubuntu job cannot compile Swift,
# and `xcodebuild` never sees a real server response. A renamed JSON key passes
# both and empties a screen on the phone.
#
# macOS minutes are expensive, so this runs only when one side of the contract
# actually moves. The paths list is repeated rather than shared via a YAML
# anchor because the Actions parser does not expand aliases.
name: iOS contract

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/lan-server.js'
      # The fixture reads the desktop's STATUSES out of this file, so a status
      # added here is what widens the capture and breaks the phone's enum. The
      # check could not fire on the change that breaks it until this was listed:
      # `shipped` went in, this workflow never ran, and the companion shipped
      # with no case for it.
      - 'renderer/analytics.js'
      - 'scripts/ios-contract-*'
      - '.github/workflows/ios-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/lan-server.js'
      # The fixture reads the desktop's STATUSES out of this file, so a status
      # added here is what widens the capture and breaks the phone's enum. The
      # check could not fire on the change that breaks it until this was listed:
      # `shipped` went in, this workflow never ran, and the companion shipped
      # with no case for it.
      - 'renderer/analytics.js'
      - 'scripts/ios-contract-*'
      - '.github/workflows/ios-contract.yml'

jobs:
  contract:
    name: LAN server and companion models
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode live server responses with the shipping Swift models
        run: npm run test:ios-contract

      # The companion's own unit tests. They need a booted simulator, which the
      # contract check above does not, so a failure here is about the app rather
      # than the desktop contract.
      - name: Companion unit tests
        run: |
          xcodebuild test \
            -scheme KhaytCompanion \
            -project ios/KhaytCompanion.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO | tail -40

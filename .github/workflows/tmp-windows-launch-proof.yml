# TEMPORARY — removed before this PR merges. Proves scripts/verify-release.mjs
# on a real Windows runner: the shipped v3.9.0 installer installs silently and
# the installed app opens; a broken install is refused and named; a wrong
# version is refused.
name: TEMP Windows launch proof

on: pull_request

jobs:
  proof:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The shipped v3.9.0 installer installs and opens (tag mode, Windows)
        timeout-minutes: 10
        run: node scripts/verify-release.mjs v3.9.0

      - name: The same installer via --app, with the version it must report
        timeout-minutes: 10
        run: |
          curl -fsSL -o Khayt-Setup-3.9.0.exe https://github.com/KhaytApp/Khayt/releases/download/v3.9.0/Khayt-Setup-3.9.0.exe
          node scripts/verify-release.mjs --app Khayt-Setup-3.9.0.exe --version 3.9.0 | tee ok.txt
          grep -q "package.json inside the bundle says 3.9.0" ok.txt || { echo "::error::the pre-launch version read was skipped"; exit 1; }

      # Git Bash rewrites `/D=C:\...`, so the installer gets its arguments from
      # PowerShell, as a shop's double-click would give them.
      - name: Install a copy to break
        shell: pwsh
        timeout-minutes: 5
        run: |
          Start-Process -Wait -FilePath .\Khayt-Setup-3.9.0.exe -ArgumentList '/S','/D=C:\kbroken'
          Get-ChildItem C:\kbroken | Select-Object -First 5

      - name: An install missing lib/branch-summary.js is refused, and named
        timeout-minutes: 8
        run: |
          npx --yes @electron/asar extract /c/kbroken/resources/app.asar x
          rm x/lib/branch-summary.js
          npx --yes @electron/asar pack x /c/kbroken/resources/app.asar
          if node scripts/verify-release.mjs --app 'C:\kbroken' --version 3.9.0 > out.txt 2>&1; then
            cat out.txt; echo "::error::a broken install PASSED"; exit 1
          fi
          cat out.txt
          grep -q "Cannot find module" out.txt || { echo "::error::failed, but not for the missing module"; exit 1; }

      - name: A wrong --version is refused
        timeout-minutes: 8
        run: |
          if node scripts/verify-release.mjs --app Khayt-Setup-3.9.0.exe --version 9.9.9 > v.txt 2>&1; then
            cat v.txt; echo "::error::a version mismatch PASSED"; exit 1
          fi
          cat v.txt

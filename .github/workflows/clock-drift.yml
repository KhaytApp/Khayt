# Run the suites with the clock advanced, so a fixture with an expiry date on it
# fails HERE — on a scheduled run nobody is waiting on — instead of on an
# unrelated pull request one morning.
#
# On 2026-08-14 the QC smoke's RMA fixture aged out: an order delivered on a
# hardcoded 2026-07-15, a 30-day warranty, and an assertion that the RMA modal
# auto-detects it as in-warranty. Thirty days later that flipped. Because
# `E2E smoke (Electron)` is a REQUIRED check with no bypass actors, NOTHING in
# the repository could merge, and the failure appeared on a PR that had touched
# none of it.
#
# Deliberately NOT a required check and not on `pull_request`: it costs a few
# minutes a month and must never be the thing standing between a fix and `main`.
# That is the failure mode it exists to prevent, and it would be a poor joke to
# reproduce it.
name: Clock drift

on:
  schedule:
    # 06:00 UTC on the 1st. Monthly is enough — the windows this catches are
    # measured in weeks (30-day warranty, 90-day token TTL), so a month's notice
    # is ample and the cost stays near zero.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to advance the clock'
        required: false
        default: '400'

jobs:
  future:
    name: Suites with the clock advanced
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 from
    # 2026-10-19 (done by 2026-11-19). This job runs Electron under xvfb-run
    # on the libraries the 24.04 image ships. 24.04 is supported for two more
    # years; moving to 26 is its own PR, with this job watched.
    runs-on: ubuntu-24.04
    env:
      # 400 days clears every window in the codebase and crosses a year boundary,
      # which a 90-day offset would not.
      DAYS: ${{ github.event.inputs.days || '400' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit suite, ${{ github.event.inputs.days || '400' }} days from now
        run: npm run test:future -- "$DAYS"

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.js

      # The e2e scripts are where the last one actually hid, and the unit preload
      # cannot reach them — their fixtures run inside the Electron renderer, in
      # its own realm. scripts/e2e/helpers.mjs shifts that clock when
      # CLOCK_SHIFT_DAYS is set.
      #
      # The list comes from package.json rather than being written out here, so a
      # new e2e suite is covered the day it is added and this file cannot drift
      # out of date the way the fixture did.
      #
      # Every suite runs even after one fails: a monthly report is only useful if
      # it names everything that is about to rot, not just the first thing.
      - name: E2E suites, ${{ github.event.inputs.days || '400' }} days from now
        env:
          CLOCK_SHIFT_DAYS: ${{ github.event.inputs.days || '400' }}
        run: |
          set -o pipefail
          suites=$(node -p "Object.keys(require('./package.json').scripts).filter(k => /^test:e2e/.test(k)).join(' ')")
          if [ -z "$suites" ]; then
            echo "::error::found no test:e2e scripts — the extractor is broken, not the suites"
            exit 1
          fi
          failed=""
          for s in $suites; do
            echo "── $s"
            xvfb-run -a npm run "$s" || failed="$failed $s"
          done
          if [ -n "$failed" ]; then
            echo "::error::fixtures that do not survive +$CLOCK_SHIFT_DAYS days:$failed"
            exit 1
          fi
          echo "All e2e suites survive +$CLOCK_SHIFT_DAYS days."

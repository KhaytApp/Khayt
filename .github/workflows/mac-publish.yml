# Sign and publish a Mac build that was made on a Mac, not here.
#
# mac/release-local.sh builds, notarises and checks the app on the shop's own
# Mac in about fifteen minutes (mac-release.yml takes two hours, almost all of
# it compiling), then uploads it as a DRAFT release in KhaytApp/khayt-mac and
# starts this. What is left needs the Sparkle key, and the only copy of that
# key is the SPARKLE_PRIVATE_KEY secret, so it happens here: sign the archive,
# publish the release, then the feed. No compiling, so it takes minutes.
name: Mac app — Publish a local build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The draft release to publish, e.g. v4.0.0-alpha.40'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release (alphas and betas: yes)'
        type: boolean
        default: true
      publish_appcast:
        description: 'Publish the Sparkle feed so existing installs see this build'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish ${{ inputs.tag }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Fetch the draft
        env:
          GH_TOKEN: ${{ secrets.KHAYT_MAC_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::KHAYT_MAC_RELEASE_TOKEN is not set."; exit 1; }
          IS_DRAFT="$(gh release view "$TAG" -R KhaytApp/khayt-mac --json isDraft --jq .isDraft)"
          [ "$IS_DRAFT" = "true" ] || { echo "::error::$TAG is not a draft — it is already published, or does not exist"; exit 1; }
          mkdir dist
          gh release download "$TAG" -R KhaytApp/khayt-mac -p '*.zip' -D dist
          ls -l dist

      # The checks mac-release.yml makes on the bundle, made again on the bytes
      # that will actually ship: what was built on a Mac is taken on trust
      # nowhere else.
      - name: The archive must be the build it claims, able to update itself
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./mac/version.json').version")"
          [ "v$V" = "$TAG" ] || { echo "::error::main is at v$V, the draft is $TAG — publish from the commit that cut it"; exit 1; }
          ARCHIVE="$(ls dist/*.zip | head -1)"
          [ "$(basename "$ARCHIVE")" = "Khayt-$V.zip" ] || { echo "::error::unexpected archive $ARCHIVE"; exit 1; }
          mkdir x && ditto -x -k "$ARCHIVE" x
          A=x/Khayt.app
          SHORT="$(plutil -extract CFBundleShortVersionString raw "$A/Contents/Info.plist")"
          BUILD="$(plutil -extract CFBundleVersion raw "$A/Contents/Info.plist")"
          [ "$SHORT" = "$V" ] || { echo "::error::the app says $SHORT, not $V"; exit 1; }
          [ "$BUILD" = "$(node -p "require('./mac/version.json').build")" ] || { echo "::error::the app is build $BUILD"; exit 1; }
          plutil -extract SUFeedURL raw "$A/Contents/Info.plist" >/dev/null || { echo "::error::no SUFeedURL"; exit 1; }
          plutil -extract SUPublicEDKey raw "$A/Contents/Info.plist" >/dev/null || { echo "::error::no SUPublicEDKey"; exit 1; }
          [ -d "$A/Contents/Frameworks/Sparkle.framework" ] || { echo "::error::Sparkle is not embedded"; exit 1; }
          codesign --verify --deep --strict "$A" || { echo "::error::the signature does not verify"; exit 1; }
          xcrun stapler validate "$A" >/dev/null || { echo "::error::the notarisation ticket is not stapled"; exit 1; }
          "$A/Contents/MacOS/Khayt" --check-resources
          echo "$V (build $BUILD): signed, stapled, self-contained, able to update"

      # sign_update from Sparkle's own release, at the version the app embeds —
      # no Swift build needed to get it.
      - name: Sign the archive
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY is not set"; exit 1; }
          SV="$(node -e "const p=JSON.parse(require('fs').readFileSync('mac/KhaytCore/Package.resolved','utf8'));console.log(p.pins.find(x=>x.identity==='sparkle').state.version)")"
          curl -fsSL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/$SV/Sparkle-$SV.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          ARCHIVE="$(ls dist/*.zip | head -1)"
          SIG="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update -f - -p "$ARCHIVE")"
          [ -n "$SIG" ] || { echo "::error::sign_update produced no signature"; exit 1; }
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "signed with Sparkle $SV's sign_update"

      # The release FIRST, the feed after: a feed naming an asset that is not
      # published yet sends every install that checks in between to a 404.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.KHAYT_MAC_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R KhaytApp/khayt-mac --draft=false --prerelease="${{ inputs.prerelease }}"

      - name: Publish the Sparkle feed
        if: ${{ inputs.publish_appcast }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::WEBSITE_SYNC_TOKEN is not set — the release is published but no install is told"; exit 1; }
          ARCHIVE="$(ls dist/*.zip | head -1)"
          node scripts/mac-appcast.js \
            --archive "$ARCHIVE" \
            --signature "${{ steps.sign.outputs.sig }}" \
            --url "https://github.com/KhaytApp/khayt-mac/releases/download/$TAG/$(basename "$ARCHIVE")" \
            --notes-url "https://github.com/KhaytApp/khayt-mac/releases/tag/$TAG" \
            --out "$RUNNER_TEMP/appcast.xml"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/KhaytApp/khayt-website.git" site
          mkdir -p site/mac
          cp "$RUNNER_TEMP/appcast.xml" site/mac/appcast.xml
          node scripts/mac-site-version.js site/index.html || echo "::warning::could not update the Mac version on the site"
          cd site
          git config user.name  "khayt-release"
          git config user.email "release@khaytapp.com"
          git add mac/appcast.xml index.html
          git commit -m "Khayt for macOS ${TAG#v}: the Sparkle feed" || { echo "the feed already names this build"; exit 0; }
          git push
          echo "### Khayt for macOS ${TAG#v} — built on a Mac, published here" >> "$GITHUB_STEP_SUMMARY"
